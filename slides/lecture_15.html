### Testing multiple parameters

.large[
$$
`\begin{aligned}
\log \left( \dfrac{\pi_i}{1 - \pi_i} \right) &amp;= \beta_0 + \beta_1 \text{GPA}_i + \beta_2 \text{GRE}_i + \\
&amp; \hspace{0.5cm} \beta_3 \text{Rank2}_i + \beta_4 \text{Rank3}_i + \beta_5 \text{Rank4}_i
\end{aligned}`
$$

`\(H_0: \beta_3 = \beta_4 = \beta_4 = 0\)`

`\(H_A: \text{ at least one of } \beta_3, \beta_4, \beta_5 \neq 0\)`

.question[
How do we test multiple parameters in a *linear* regression model?
]
]

### Comparing nested models

.large[
**Full model** (`\(H_A\)`):

$$
`\begin{aligned}
\log \left( \dfrac{\pi_i}{1 - \pi_i} \right) &amp;= \beta_0 + \beta_1 \text{GPA}_i + \beta_2 \text{GRE}_i + \\
&amp; \hspace{0.5cm} \beta_3 \text{Rank2}_i + \beta_4 \text{Rank3}_i + \beta_5 \text{Rank4}_i
\end{aligned}`
$$

**Reduced model** (`\(H_0\)`):

$$
`\begin{aligned}
\log \left( \dfrac{\pi_i}{1 - \pi_i} \right) &amp;= \beta_0 + \beta_1 \text{GPA}_i + \beta_2 \text{GRE}_i
\end{aligned}`
$$
.question[
How should we compare these two nested models?
]
]

### Comparing nested models

.large[
**Deviance:** for a logistic regression model, deviance is `\(-2 \log L\)`

**Idea:**

* Maximizing likelihood (how we fit the model) is equivalent to minimizing deviance
* Smaller deviance implies better fit
* Is there a big difference in the deviance (model fit) between these models??

**Change in deviance:**

]

### Comparing deviance




.large[

``` r
m_full &lt;- glm(admit ~ gpa + gre + as.factor(rank),
              family = binomial, data = grad_app)

m_reduced &lt;- glm(admit ~ gpa + gre,
                 family = binomial, data = grad_app)

m_reduced$deviance - m_full$deviance
```

```
## [1] 21.82649
```

.question[
How do I know whether this is a big change in deviance? That is: **is a change in deviance of 21.83 unusual under the null hypothesis?**
]
